<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Avatar: ảnh nếu có, không thì chữ cái đầu của tên hiển thị. Tên luôn nằm cạnh nên alt để trống. -->
<span th:fragment="avatar(profile, cls)" class="avatar" th:classappend="${cls}">
    <img th:if="${profile.avatarUrl != null}" th:src="${profile.avatarUrl}" alt="" loading="lazy">
    <th:block th:unless="${profile.avatarUrl != null}"
              th:text="${#strings.toUpperCase(#strings.substring(profile.displayName, 0, 1))}">A</th:block>
</span>

<!-- Chip vai trò -->
<span th:fragment="roleChip(role)" class="role-chip"
      th:classappend="${role.name() == 'USER'} ? '' : 'role-chip--' + ${#strings.toLowerCase(role.name())}"
      th:text="${role.label()}">Người dùng</span>

<!-- Tích vàng đã xác minh cho Creator (giống tích xanh của mạng xã hội khác). Tham số: vai trò chính của người đó (Role);
     chỉ vẽ khi là CREATOR. Có chữ thay thế cho trình đọc màn hình và gợi ý khi rê chuột. -->
<svg th:fragment="verified(role)" th:if="${role != null and role.name() == 'CREATOR'}" class="verified-badge" viewBox="0 0 24 24"
     role="img" aria-label="Creator đã xác minh" focusable="false">
    <title>Creator đã xác minh</title>
    <polygon points="12.00,1.20 14.38,3.11 17.40,2.65 18.51,5.49 21.35,6.60 20.89,9.62 22.80,12.00 20.89,14.38 21.35,17.40 18.51,18.51 17.40,21.35 14.38,20.89 12.00,22.80 9.62,20.89 6.60,21.35 5.49,18.51 2.65,17.40 3.11,14.38 1.20,12.00 3.11,9.62 2.65,6.60 5.49,5.49 6.60,2.65 9.62,3.11" fill="#F5B800" stroke="#1B1B1F" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M7.4 12.4l3.2 3.2 6-6.6" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<!-- Tấm bảng sticker bên cạnh form xác thực (chỉ trang trí) -->
<div th:fragment="authSide(headline, sub, tone)" class="auth-side" aria-hidden="true">
    <div class="note note--taped tilt-r" th:classappend="'note--' + ${tone}"
         style="position:absolute; top:6%; left:8%; width:min(330px, 80%);">
        <p class="display mb-2" style="font-size:1.9rem; line-height:1.1" th:text="${headline}">Headline</p>
        <p class="mb-0 text-soft" th:text="${sub}">Sub</p>
    </div>
    <span class="sticker sticker--lavender" style="--rot:7deg; position:absolute; top:2%; right:10%">bạn thân 💜</span>
    <span class="sticker sticker--round sticker--pink" style="--rot:-10deg; position:absolute; top:46%; left:2%">✨</span>
    <div class="note tilt-l" style="position:absolute; bottom:4%; right:4%; width:min(250px, 62%);">
        <span class="bubble bubble--in">alô alô, ai đó không?</span>
        <span class="bubble bubble--out mb-0">có mình nè 👋</span>
    </div>
    <span class="sticker sticker--mint" style="--rot:-5deg; position:absolute; bottom:30%; right:0">online</span>
</div>

<!-- Lỗi chung của form (không thuộc trường nào) -->
<div th:fragment="globalErrors" th:if="${#fields.hasGlobalErrors()}" class="alert-al alert-al--error" role="alert">
    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Lỗi</p>
</div>

</body>
</html>
