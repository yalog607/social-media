<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Mảnh tin nhắn dùng cho cả trang hội thoại lẫn tải thêm tin cũ: dấu "còn tin cũ hơn" rồi các bong bóng theo thứ tự thời gian. -->
<th:block th:fragment="list">
    <div class="chat-more" th:if="${page.hasMore()}"
         th:attr="data-before-url=@{/api/conversations/{id}/messages(id=${conversation.id}, before=${page.nextCursor})}"></div>
        
    <th:block th:each="m : ${page.messages}">
        
        <!-- Tin nhắn hệ thống -->
        <div th:if="${m.isSystem}" class="msg justify-content-center text-center my-3" th:id="'msg-' + ${m.id}">
            <span class="text-dark fw-medium" th:utext="${m.contentHtml}">Nội dung</span>
        </div>
        
        <!-- Tin nhắn bình thường -->
        <div th:unless="${m.isSystem}" class="msg" th:id="'msg-' + ${m.id}" th:classappend="${m.sender.id.equals(me.id)} ? 'is-mine'" th:attr="data-id=${m.id}">
            <a th:href="@{/u/{username}(username=${m.sender.username})}">
                <span th:replace="~{fragments/ui :: avatar(${m.sender}, '')}"></span>
            </a>
            <div class="msg-body">
                <div class="d-flex align-items-center mb-1" th:if="${header.group}">
                    <span class="msg-sender mb-0" th:text="${m.sender.displayName}">Tên</span>
                    <svg th:replace="~{fragments/ui :: verified(${m.sender.primaryRole})}"></svg>
                </div>
                
                <!-- Khung trả lời tin nhắn kiểu Messenger (Hình 3) -->
                <div th:if="${m.reply != null}" class="msg-reply-container"
                     th:classappend="${m.sender.id.equals(me.id)} ? 'is-mine' : ''"
                     th:attr="data-mid=${m.reply.messageId}, data-snippet=${m.reply.snippet}"
                     onclick="scrollToRepliedMessage(this.dataset.mid, this.dataset.snippet)"
                     title="Nhấn để xem tin nhắn gốc">
                    <div class="msg-reply-indicator">
                        <svg class="icon" width="12" height="12" aria-hidden="true"><use href="#i-reply"/></svg>
                        <span th:text="${m.sender.id.equals(me.id)} ? ('Bạn đã trả lời ' + ${m.reply.senderName}) : (${header.group} ? (${m.sender.displayName} + ' đã trả lời ' + ${m.reply.senderName}) : (${m.sender.displayName} + ' đã trả lời bạn'))">Bạn đã trả lời Tuấn</span>
                    </div>
                    <div class="msg-reply-snippet-bubble" th:text="${m.reply.snippet}">Nội dung trích dẫn</div>
                </div>

                <!-- Hàng hiển thị bóng chat và 3 tác nhân bên cạnh (Hình 1 & 2) -->
                <div class="msg-row d-flex align-items-center gap-2" th:classappend="${m.sender.id.equals(me.id)} ? 'flex-row-reverse' : ''">
                    <div class="msg-bubble-wrap position-relative">
                        <!-- Tin nhắn nhãn dán (Sticker) -->
                        <div th:if="${m.sticker != null or m.giphyId != null}" class="msg-sticker-wrap" th:classappend="${m.sender.id.equals(me.id)} ? 'text-end' : 'text-start'">
                            <span th:if="${m.pinned}" title="Đã ghim" class="text-warning mb-1 d-block" style="font-size: 12px;">📌 Tin nhắn đã ghim</span>
                            <span th:if="${m.giphyId != null}" class="text-soft small">Nhãn dán từ nguồn cũ không còn hiển thị.</span>
                            <svg th:if="${m.sticker != null and m.sticker.artwork() != null}" class="sticker-art sticker-art--message"
                                 th:attr="viewBox=${m.sticker.artwork().viewBox}" role="img" th:aria-label="${m.sticker.name}">
                                <defs><clipPath th:id="'message-art-' + ${m.id}" clipPathUnits="userSpaceOnUse"><polygon th:attr="points=${m.sticker.artwork().clipPoints}"></polygon></clipPath></defs>
                                <image th:href="@{/stickers/original/characters.png}" width="1024" height="1536" th:attr="clip-path='url(#message-art-' + ${m.id} + ')'"></image>
                            </svg>
                            <img th:if="${m.sticker != null and m.sticker.renderType == 'IMAGE'}" class="sticker-art sticker-art--message sticker-image" th:src="${m.sticker.imageUrl}" th:alt="${m.sticker.name}" loading="lazy">
                            <span th:if="${m.sticker != null and !m.sticker.visibleArtwork()}" class="text-soft small">Nhãn dán cũ không còn hiển thị.</span>
                            <span th:if="${!#strings.isEmpty(m.contentHtml)}" class="bubble d-block mt-1" th:classappend="${m.sender.id.equals(me.id)} ? 'bubble--out' : 'bubble--in'" th:utext="${m.contentHtml}">Nội dung</span>
                        </div>
                        
                        <!-- Tin nhắn thường (văn bản / file) -->
                        <span th:unless="${m.sticker != null or m.giphyId != null}" class="bubble" th:classappend="${m.sender.id.equals(me.id)} ? 'bubble--out' : 'bubble--in'">
                            <span th:if="${m.pinned}" title="Đã ghim" class="text-warning mb-1 d-block" style="font-size: 12px;">📌 Tin nhắn đã ghim</span>
                            <a th:if="${m.attachment != null and m.attachment.kind.name() == 'IMAGE'}"
                               class="lightbox-trigger" role="button" tabindex="0" aria-label="Xem ảnh cỡ lớn"
                               th:attr="data-lightbox=${m.attachment.url}">
                                <img class="msg-attachment-img" th:src="${m.attachment.url}" alt="Ảnh đính kèm">
                            </a>
                            <video th:if="${m.attachment != null and m.attachment.kind.name() == 'VIDEO'}"
                                   class="msg-attachment-video" th:src="${m.attachment.url}" controls></video>
                            <a th:if="${m.attachment != null and m.attachment.kind.name() == 'FILE'}" class="btn-al btn-al--white rounded-pill d-inline-block mt-1"
                               th:href="${m.attachment.url}" th:text="${m.attachment.originalName}" target="_blank" rel="noopener" style="color: var(--ink); border: 2px solid var(--ink); padding: 0.5rem 1rem; font-weight: bold; background: white;">file.pdf</a>
                            <span th:if="${!#strings.isEmpty(m.contentHtml)}" th:utext="${m.contentHtml}">Nội dung</span>
                        </span>
                        <div class="msg-reactions-badge" th:id="'msg-reactions-' + ${m.id}"
                             th:classappend="${(m.reactions == null or m.reactions.total() == 0) ? 'd-none' : (m.reactions.total() == 1 ? 'is-single' : '')}"
                             role="button" tabindex="0" title="Xem ai đã thả cảm xúc"
                             data-bs-toggle="modal" data-bs-target="#reactorsModal"
                             th:attr="data-mid=${m.id}, data-cid=${conversation.id}">
                            <span class="msg-reactions-emojis">
                                <span th:each="type : ${T(com.aloute.model.reaction.ReactionType).values()}"
                                      th:class="'mr-emoji mr-emoji--' + ${type.name()}"
                                      th:classappend="${(m.reactions == null or m.reactions.count(type) == 0) ? 'd-none' : ''}"
                                      th:text="${type.emoji()}"></span>
                            </span>
                            <span class="msg-reactions-count"
                                  th:classappend="${(m.reactions != null and m.reactions.total() > 1) ? '' : 'd-none'}"
                                  th:text="${m.reactions != null ? m.reactions.total() : 0}">0</span>
                        </div>
                    </div>

                    <!-- 3 tác nhân bên cạnh: 1. Bày tỏ cảm xúc, 2. Trả lời, 3. Khác (Ghim, Sửa, Xóa) -->
                    <div class="msg-actions" th:if="${me != null}">
                        <!-- 1. Bày tỏ cảm xúc -->
                        <div class="msg-reaction-container">
                            <button type="button" class="msg-action-btn msg-action-btn--react" title="Bày tỏ cảm xúc" aria-label="Bày tỏ cảm xúc">
                                <svg class="icon" width="15" height="15" aria-hidden="true"><use href="#i-smile"/></svg>
                            </button>
                            <div class="msg-reaction-bar">
                                <button type="button" class="msg-reaction-btn"
                                        th:each="type : ${T(com.aloute.model.reaction.ReactionType).values()}"
                                        th:attr="data-mid=${m.id}, data-cid=${conversation.id}, data-type=${type.name()}"
                                        th:title="${type.label()}">
                                    <span th:text="${type.emoji()}"></span>
                                </button>
                            </div>
                        </div>

                        <!-- 2. Trả lời -->
                        <button type="button" class="msg-action-btn msg-action-btn--reply"
                                th:attr="onclick='startReply(\'' + ${m.id} + '\', \'' + ${#strings.escapeJavaScript(m.sender.displayName)} + '\')'"
                                title="Trả lời" aria-label="Trả lời">
                            <svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-reply"/></svg>
                        </button>

                        <!-- 3. Hành động khác -->
                        <th:block th:with="isSender=${m.sender.id == me.id}, canPin=${header.group and canManage}, canDelete=${isSender or (header.group and canManage)}">
                            <div class="dropdown msg-more-dropdown">
                                <button type="button" class="msg-action-btn msg-action-btn--more" data-bs-toggle="dropdown" aria-expanded="false" title="Khác" aria-label="Khác">
                                    <svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-more"/></svg>
                                </button>
                                <ul class="dropdown-menu menu-al msg-dropdown-menu" th:classappend="${m.sender.id.equals(me.id)} ? 'dropdown-menu-end' : ''">
                                    <li th:if="${isSender and m.sticker == null and m.giphyId == null}">
                                        <button class="dropdown-item" type="button" th:attr="onclick='editMessage(\'' + ${m.id} + '\')'">
                                            <svg class="icon" width="15" height="15" aria-hidden="true"><use href="#i-pencil"/></svg>
                                            <span>Sửa tin nhắn</span>
                                        </button>
                                    </li>
                                    <li th:if="${canPin}">
                                        <form method="post" th:action="@{/messages/{id}/pins/{mid}(id=${conversation.id}, mid=${m.id})}">
                                            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                                            <input type="hidden" name="pin" th:value="${!m.pinned}">
                                            <button class="dropdown-item" type="submit">
                                                <svg class="icon" width="15" height="15" aria-hidden="true"><use href="#i-pin"/></svg>
                                                <span th:text="${m.pinned ? 'Bỏ ghim' : 'Ghim tin nhắn'}">Ghim tin nhắn</span>
                                            </button>
                                        </form>
                                    </li>
                                    <li>
                                        <button class="dropdown-item" type="button" th:attr="onclick='copyMessageText(\'' + ${m.id} + '\')'">
                                            <svg class="icon" width="15" height="15" aria-hidden="true"><use href="#i-copy"/></svg>
                                            <span>Sao chép văn bản</span>
                                        </button>
                                    </li>
                                    <li th:if="${canDelete}"><hr class="dropdown-divider my-1"></li>
                                    <li th:if="${canDelete}">
                                        <button class="dropdown-item text-danger" type="button" th:attr="onclick='confirmDeleteMessage(\'' + ${conversation.id} + '\', \'' + ${m.id} + '\')'">
                                            <svg class="icon" width="15" height="15" aria-hidden="true"><use href="#i-trash"/></svg>
                                            <span>Xóa tin nhắn</span>
                                        </button>
                                    </li>
                                </ul>
                            </div>
                        </th:block>
                    </div>
                </div>

                <span class="msg-time d-flex align-items-center gap-2">
                    <span th:title="${@timeAgo.full(m.createdAt)}" th:text="${@timeAgo.format(m.createdAt)}">vừa xong</span>
                </span>
            </div>
        </div>
    </th:block>
</th:block>
</body>
</html>
