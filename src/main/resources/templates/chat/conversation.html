<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${header.title}, ~{::main}, 'messages', ~{})}">
<head><title>Tin nhắn</title></head>
<body>
<main th:attr="data-conversation-id=${conversation.id}, data-user-id=${me.id}, data-group=${header.group}" id="chat-main">
    <div class="chat-header">
        <span class="avatar">
            <img th:if="${header.avatarUrl != null}" th:src="${header.avatarUrl}" alt="" loading="lazy">
            <th:block th:unless="${header.avatarUrl != null}"
                      th:text="${#strings.toUpperCase(#strings.substring(header.title, 0, 1))}">A</th:block>
        </span>
        <div>
            <h1 th:text="${header.title}">Tên</h1>
            <p class="streak" th:if="${streak.active()}" th:classappend="${streak.atRisk()} ? 'streak--risk'"
               th:title="${streak.atRisk()} ? 'Hôm nay hai bạn chưa cùng nhắn, hãy nhắn để giữ chuỗi!' : 'Hai bạn đã nhắn nhau mỗi ngày liên tiếp'">
                🔥 <strong th:text="${streak.days()}">3</strong> ngày<span th:if="${streak.atRisk()}"> · nhắn hôm nay để giữ chuỗi!</span>
            </p>
            <p class="text-soft mb-0" th:if="${header.group}" th:text="${#lists.size(members)} + ' thành viên'">3 thành viên</p>
        </div>
        <div class="chat-header-actions">
            <a class="btn-al btn-al--white btn-al--sm" th:href="@{/messages}">← Tất cả tin nhắn</a>
            <form method="post" th:if="${header.group}" th:action="@{/messages/{id}/leave(id=${conversation.id})}">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <button type="submit" class="btn-al btn-al--white btn-al--sm">Rời nhóm</button>
            </form>
        </div>
    </div>

    <section class="mb-3" aria-label="Cài đặt hội thoại">
        <details class="chat-settings">
            <summary class="btn-al btn-al--white btn-al--sm" style="display:inline-block; cursor:pointer"
                     th:text="${header.group} ? 'Thành viên & cài đặt nhóm' : 'Biệt danh'">Cài đặt</summary>
            <div class="mt-3">
                <div class="chat-group-forms" th:if="${canManage}">
                    <form method="post" th:action="@{/messages/{id}/title(id=${conversation.id})}" class="chat-new-form">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                        <input class="input-al" name="title" required maxlength="100" th:value="${header.title}" aria-label="Tên nhóm">
                        <button type="submit" class="btn-al btn-al--pink btn-al--sm">Đổi tên nhóm</button>
                    </form>
                    <form method="post" enctype="multipart/form-data" th:action="@{/messages/{id}/avatar(id=${conversation.id})}" class="chat-new-form">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                        <input class="input-al" type="file" name="avatar" required accept="image/jpeg,image/png,image/gif,image/webp" aria-label="Ảnh nhóm">
                        <button type="submit" class="btn-al btn-al--sky btn-al--sm">Đổi ảnh nhóm</button>
                    </form>
                </div>

                <ul class="list-unstyled chat-members">
                    <li class="chat-member" th:each="m : ${memberViews}">
                        <div class="chat-member-head">
                            <span th:replace="~{fragments/ui :: avatar(${m}, 'avatar--sm')}"></span>
                            <span>
                                <strong th:text="${m.shownName()}">Tên</strong>
                                <span class="text-soft small" th:if="${m.nickname != null}" th:text="'(' + ${m.displayName} + ')'">(tên thật)</span>
                                <span class="role-chip" th:if="${header.group}" th:text="${m.role.label()}">Thành viên</span>
                            </span>
                        </div>
                        <div class="chat-member-actions">
                            <form method="post" class="d-flex gap-1"
                                  th:if="${!header.group or m.id == me.id or (canManage and myRole.outranks(m.role))}"
                                  th:action="@{/messages/{id}/members/{uid}/nickname(id=${conversation.id}, uid=${m.id})}">
                                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                                <input class="input-al input-al--sm" name="nickname" th:maxlength="${maxNickname}" th:value="${m.nickname}"
                                       placeholder="Biệt danh" th:attr="aria-label='Biệt danh của ' + ${m.displayName}">
                                <button type="submit" class="btn-al btn-al--white btn-al--sm">Lưu</button>
                            </form>
                            <th:block th:if="${isOwner and m.id != me.id}">
                                <form method="post" th:action="@{/messages/{id}/members/{uid}/role(id=${conversation.id}, uid=${m.id})}">
                                    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                                    <input type="hidden" name="role" th:value="${m.role.name() == 'ADMIN'} ? 'MEMBER' : 'ADMIN'">
                                    <button type="submit" class="btn-al btn-al--white btn-al--sm"
                                            th:text="${m.role.name() == 'ADMIN'} ? 'Gỡ quản trị viên' : 'Làm quản trị viên'">Quản trị viên</button>
                                </form>
                                <form method="post" th:action="@{/messages/{id}/members/{uid}/owner(id=${conversation.id}, uid=${m.id})}"
                                      onsubmit="return confirm('Nhường quyền chủ nhóm cho người này? Bạn sẽ trở thành quản trị viên.')">
                                    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                                    <button type="submit" class="btn-al btn-al--white btn-al--sm">Nhường chủ nhóm</button>
                                </form>
                            </th:block>
                            <form method="post" th:if="${header.group and canManage and m.id != me.id and myRole.outranks(m.role)}"
                                  th:action="@{/messages/{id}/members/{uid}/remove(id=${conversation.id}, uid=${m.id})}"
                                  onsubmit="return confirm('Xóa người này khỏi nhóm?')">
                                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                                <button type="submit" class="btn-al btn-al--ink btn-al--sm">Xóa khỏi nhóm</button>
                            </form>
                        </div>
                    </li>
                </ul>

                <form method="post" th:if="${canManage and !#lists.isEmpty(friendsNotInGroup)}" th:action="@{/messages/{id}/members(id=${conversation.id})}"
                      class="chat-new-form">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                    <select class="input-al" name="memberId" required data-custom-select>
                        <option value="" disabled selected>Thêm bạn bè vào nhóm...</option>
                        <option th:each="f : ${friendsNotInGroup}" th:value="${f.id}" th:text="${f.displayName}">Tên</option>
                    </select>
                    <button type="submit" class="btn-al btn-al--pink btn-al--sm">Thêm</button>
                </form>
            </div>
        </details>
    </section>

    <div class="chat-window" id="chat-window">
        <th:block th:replace="~{chat/messages :: list}"></th:block>
        <p class="text-soft text-center" th:if="${#lists.isEmpty(page.messages)}">Chưa có tin nhắn nào, bắt đầu chào hỏi nhé!</p>
    </div>

    <div class="chat-attach-preview" id="chat-attach-preview" hidden>
        <span id="chat-attach-name"></span>
        <button type="button" id="chat-attach-clear" aria-label="Bỏ file đính kèm">×</button>
    </div>
    <form class="chat-composer" id="chat-composer">
        <input type="file" id="chat-attach-input" hidden>
        <button type="button" class="chat-attach-btn" id="chat-attach-btn" aria-label="Đính kèm file">
            <svg aria-hidden="true"><use href="#i-paperclip"/></svg>
        </button>
        <textarea name="content" rows="1" maxlength="2000" th:placeholder="${header.group} ? 'Nhắn gì đó... (@ để nhắc tên)' : 'Nhắn gì đó...'" placeholder="Nhắn gì đó..."
                  th:attr="data-mention-url=${header.group} ? @{/api/conversations/{id}/members(id=${conversation.id})}" aria-label="Nội dung tin nhắn"></textarea>
        <button type="submit" class="chat-send-btn" aria-label="Gửi">
            <svg aria-hidden="true"><use href="#i-send"/></svg>
        </button>
    </form>
    <script th:src="@{/webjars/sockjs-client/sockjs.min.js}"></script>
    <script th:src="@{/webjars/stomp-websocket/stomp.min.js}"></script>
    <script th:src="@{/js/chat.js}"></script>
    <script th:src="@{/js/custom-select.js}"></script>
</main>
</body>
</html>
