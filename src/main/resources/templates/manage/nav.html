<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Thanh điều hướng con của khu Kiểm duyệt. Tham số: trang đang mở. -->
<nav th:fragment="tabs(current)" class="d-flex flex-wrap gap-2 mb-3" aria-label="Kiểm duyệt">
    <a class="btn-al btn-al--sm" th:classappend="${current == 'queue'} ? 'btn-al--role' : 'btn-al--white'" th:href="@{/manage}">Báo cáo</a>
    <a class="btn-al btn-al--sm" th:classappend="${current == 'suspended'} ? 'btn-al--role' : 'btn-al--white'" th:href="@{/manage/suspended}">Đang bị khóa</a>
</nav>
</body>
</html>
