<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Bạn bè', ~{::main}, 'friends', ~{})}">
<head><title>Bạn bè</title></head>
<body>
<main>
    <div class="page-title"><h1>Bạn bè</h1></div>

    <section class="mb-4" th:unless="${#lists.isEmpty(incoming)}">
        <h2 class="h4 mb-2">Lời mời kết bạn</h2>
        <div class="search-user" th:each="r : ${incoming}">
            <span th:replace="~{fragments/ui :: avatar(${r.person}, '')}"></span>
            <span class="search-user-info">
                <a class="search-user-name" th:href="@{/u/{u}(u=${r.person.username})}" th:text="${r.person.displayName}">Tên</a><svg th:replace="~{fragments/ui :: verified(${r.person.primaryRole})}"></svg>
                <span class="search-user-handle" th:text="'@' + ${r.person.username}">@username</span>
            </span>
            <form method="post" th:action="@{/u/{u}/friend-accept(u=${r.person.username})}">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <input type="hidden" name="next" th:value="@{/friends}">
                <button type="submit" class="btn-al btn-al--pink btn-al--sm">Chấp nhận</button>
            </form>
            <form method="post" th:action="@{/u/{u}/friend-decline(u=${r.person.username})}">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <input type="hidden" name="next" th:value="@{/friends}">
                <button type="submit" class="btn-al btn-al--white btn-al--sm">Từ chối</button>
            </form>
        </div>
    </section>

    <section class="mb-4" th:unless="${#lists.isEmpty(outgoing)}">
        <h2 class="h4 mb-2">Lời mời đã gửi</h2>
        <div class="search-user" th:each="r : ${outgoing}">
            <span th:replace="~{fragments/ui :: avatar(${r.person}, '')}"></span>
            <span class="search-user-info">
                <a class="search-user-name" th:href="@{/u/{u}(u=${r.person.username})}" th:text="${r.person.displayName}">Tên</a><svg th:replace="~{fragments/ui :: verified(${r.person.primaryRole})}"></svg>
                <span class="search-user-handle" th:text="'@' + ${r.person.username}">@username</span>
            </span>
            <form method="post" th:action="@{/u/{u}/friend-cancel(u=${r.person.username})}">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <input type="hidden" name="next" th:value="@{/friends}">
                <button type="submit" class="btn-al btn-al--white btn-al--sm">Hủy lời mời</button>
            </form>
        </div>
    </section>

    <section>
        <h2 class="h4 mb-2">Bạn bè (<span th:text="${#lists.size(friends)}">0</span>)</h2>
        <a class="search-user" th:each="f : ${friends}" th:href="@{/u/{u}(u=${f.username})}">
            <span th:replace="~{fragments/ui :: avatar(${f}, '')}"></span>
            <span class="search-user-info">
                <span class="search-user-name" th:text="${f.displayName}">Tên</span><svg th:replace="~{fragments/ui :: verified(${f.primaryRole})}"></svg>
                <span class="search-user-handle" th:text="'@' + ${f.username}">@username</span>
            </span>
        </a>
        <section class="note note--sky empty" th:if="${#lists.isEmpty(friends)}">
            <h2 class="h3">Chưa có bạn bè nào</h2>
            <p>Ghé trang cá nhân của ai đó và bấm "Kết bạn" nhé.</p>
        </section>
    </section>
</main>
</body>
</html>
