<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${owner.profile.displayName}, ~{::main}, ${isOwner} ? 'profile' : 'none', ~{})}">
<head><title>Trang cá nhân</title></head>
<body>
<main th:with="canZoomCover=${canView and canZoomPhotos and owner.profile.coverUrl != null},
                canZoomAvatar=${canZoomPhotos and owner.profile.avatarUrl != null}">
    <article class="note p-0 overflow-hidden mb-4" style="padding:0">
        <div class="profile-cover" th:classappend="${canZoomCover} ? 'is-zoomable'"
             th:style="${canView and owner.profile.coverUrl != null} ? 'background-image:url(' + ${owner.profile.coverUrl} + ')' : null"
             th:attr="data-lightbox=${canZoomCover} ? ${owner.profile.coverUrl},
                      role=${canZoomCover} ? 'button', tabindex=${canZoomCover} ? '0',
                      aria-label=${canZoomCover} ? 'Xem ảnh bìa cỡ lớn'"></div>
        <div class="p-4 pt-0">
            <div class="d-flex flex-wrap align-items-end gap-3" style="margin-top:-56px">
                <span th:classappend="${canZoomAvatar} ? 'lightbox-trigger'"
                      th:attr="data-lightbox=${canZoomAvatar} ? ${owner.profile.avatarUrl},
                               role=${canZoomAvatar} ? 'button', tabindex=${canZoomAvatar} ? '0',
                               aria-label=${canZoomAvatar} ? 'Xem ảnh đại diện cỡ lớn'">
                    <span th:replace="~{fragments/ui :: avatar(${owner.profile}, 'avatar--xl')}"></span>
                </span>

                <div class="ms-auto pb-2" th:if="${isOwner}">
                    <a class="btn-al btn-al--sm" th:href="@{/settings}">Chỉnh sửa hồ sơ</a>
                </div>

                <div class="ms-auto pb-2 d-flex gap-2 flex-wrap align-items-center" th:if="${!isOwner and me != null}">
                    <form method="post" th:if="${hasBlocked}" th:action="@{/u/{u}/unblock(u=${owner.username})}">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                        <input type="hidden" name="next" th:value="${currentPath}">
                        <button type="submit" class="btn-al btn-al--white btn-al--sm">Bỏ chặn</button>
                    </form>

                    <th:block th:unless="${blockedEitherWay}">
                        <button type="button" class="btn-al btn-al--role btn-al--sm" th:if="${owner.hasRole(T(com.aloute.model.user.Role).CREATOR)}"
                                data-bs-toggle="modal" data-bs-target="#donateModal"
                                th:attr="data-donate-user=${owner.id}, data-donate-name=${owner.profile.displayName}">Tặng Xu</button>
                        <form method="post" th:if="${friendState.name() == 'NONE'}" th:action="@{/u/{u}/friend-request(u=${owner.username})}">
                            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                            <input type="hidden" name="next" th:value="${currentPath}">
                            <button type="submit" class="btn-al btn-al--pink btn-al--sm">Kết bạn</button>
                        </form>
                        <form method="post" th:if="${friendState.name() == 'OUTGOING'}" th:action="@{/u/{u}/friend-cancel(u=${owner.username})}">
                            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                            <input type="hidden" name="next" th:value="${currentPath}">
                            <button type="submit" class="btn-al btn-al--white btn-al--sm">Hủy lời mời</button>
                        </form>
                        <form method="post" th:if="${friendState.name() == 'INCOMING'}" th:action="@{/u/{u}/friend-accept(u=${owner.username})}">
                            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                            <input type="hidden" name="next" th:value="${currentPath}">
                            <button type="submit" class="btn-al btn-al--pink btn-al--sm">Chấp nhận</button>
                        </form>
                        <form method="post" th:if="${friendState.name() == 'INCOMING'}" th:action="@{/u/{u}/friend-decline(u=${owner.username})}">
                            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                            <input type="hidden" name="next" th:value="${currentPath}">
                            <button type="submit" class="btn-al btn-al--white btn-al--sm">Từ chối</button>
                        </form>
                        <form method="post" th:if="${friendState.name() == 'FRIENDS'}" th:action="@{/u/{u}/unfriend(u=${owner.username})}">
                            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                            <input type="hidden" name="next" th:value="${currentPath}">
                            <button type="submit" class="btn-al btn-al--white btn-al--sm">★ Bạn bè</button>
                        </form>

                        <form method="post" th:if="${isFollowing}" th:action="@{/u/{u}/unfollow(u=${owner.username})}">
                            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                            <input type="hidden" name="next" th:value="${currentPath}">
                            <button type="submit" class="btn-al btn-al--white btn-al--sm">Đang theo dõi</button>
                        </form>
                        <form method="post" th:unless="${isFollowing}" th:action="@{/u/{u}/follow(u=${owner.username})}">
                            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                            <input type="hidden" name="next" th:value="${currentPath}">
                            <button type="submit" class="btn-al btn-al--white btn-al--sm">Theo dõi</button>
                        </form>

                        <div class="dropdown">
                            <button type="button" class="post-menu-btn" data-bs-toggle="dropdown" aria-expanded="false"
                                    aria-label="Tùy chọn khác">&#8943;</button>
                            <ul class="dropdown-menu dropdown-menu-end menu-al">
                                <li>
                                    <form method="post" th:action="@{/u/{u}/block(u=${owner.username})}">
                                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                                        <input type="hidden" name="next" th:value="@{/}">
                                        <button type="submit" class="dropdown-item">Chặn người này</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </th:block>
                </div>
            </div>
            <h1 class="h2 mt-3 mb-1"><span th:text="${owner.profile.displayName}">Tên hiển thị</span><svg th:replace="~{fragments/ui :: verified(${owner.primaryRole()})}"></svg></h1>
            <p class="text-soft mb-2">@<span th:text="${owner.username}">username</span></p>
            <p class="d-flex flex-wrap gap-2 align-items-center mb-3">
                <th:block th:if="${owner.primaryRole().name() != 'USER'}">
                    <span th:replace="~{fragments/ui :: roleChip(${owner.primaryRole()})}"></span>
                </th:block>
                <span class="text-soft">Tham gia từ <span th:text="${joined}">01/2026</span></span>
            </p>
            <p class="d-flex flex-wrap gap-3 profile-stats mb-3">
                <a href="javascript:void(0)" class="text-ink text-decoration-none" data-bs-toggle="modal" data-bs-target="#friendsModal">
                    <strong th:text="${friendCount}">0</strong> bạn bè
                </a>
                <a href="javascript:void(0)" class="text-ink text-decoration-none" data-bs-toggle="modal" data-bs-target="#followersModal">
                    <strong th:text="${followerCount}">0</strong> người theo dõi
                </a>
                <a href="javascript:void(0)" class="text-ink text-decoration-none" data-bs-toggle="modal" data-bs-target="#followingModal">
                    <strong th:text="${followingCount}">0</strong> đang theo dõi
                </a>
            </p>
            <p class="mb-0" th:if="${canView and owner.profile.bio != null}" th:text="${owner.profile.bio}">Giới thiệu</p>
        </div>
    </article>

    <section class="note note--lavender empty" th:unless="${canView}">
        <h2 class="h3" th:text="${hasBlocked} ? 'Bạn đã chặn người này' : 'Trang này ở chế độ riêng tư'">Trang riêng tư</h2>
        <p th:text="${hasBlocked} ? 'Bỏ chặn để xem lại trang cá nhân của họ.' : 'Chủ tài khoản chỉ chia sẻ trang cá nhân với một số người.'">...</p>
    </section>

    <style>
        .featured-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            border: 2.5px solid var(--ink);
            border-radius: var(--r-card);
            box-shadow: 4px 4px 0 var(--ink);
            position: relative;
            background: var(--white);
            color: inherit;
        }
        .featured-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 7px 7px 0 var(--ink);
        }
        .featured-card:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--ink);
        }
        .featured-card-link::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
        }
    </style>
    <th:block th:if="${canView}">
        <div id="pinned-feed" class="note mb-4 p-4" th:if="${!#lists.isEmpty(pinnedPosts)}">
            <h3 class="h4 mb-3 text-ink" style="font-weight: 800;">Đáng chú ý</h3>
            <div class="row g-3 flex-nowrap overflow-auto" style="padding-bottom: .5rem;">
                <th:block th:each="p, stat : ${pinnedPosts}" th:if="${stat.index < 3}">
                    <div class="col-10 col-sm-6 col-md-4">
                        <article class="post p-0 overflow-hidden d-flex flex-column h-100 featured-card">
                            <div class="p-3 pb-2">
                                <div class="d-flex align-items-start gap-2 mb-2">
                                    <span style="--size: 36px; flex: none;" th:replace="~{fragments/ui :: avatar(${p.author}, '')}"></span>
                                    <div style="min-width: 0; flex: 1;">
                                        <div class="text-truncate" style="font-weight: 700; font-size: .95rem; font-family: var(--font-display); color: var(--ink);">
                                            <span th:text="${p.author.displayName}">Tên</span><svg th:replace="~{fragments/ui :: verified(${p.author.primaryRole})}"></svg>
                                        </div>
                                        <div class="text-soft d-flex align-items-center gap-1" style="font-size: .8rem;">
                                            <span th:text="${@timeAgo.format(p.createdAt)}">vừa xong</span>
                                            <span th:if="${p.visibility.name() == 'PUBLIC'}">🌍</span>
                                            <span th:if="${p.visibility.name() == 'FRIENDS'}">👥</span>
                                            <span th:if="${p.visibility.name() == 'PRIVATE'}">🔒</span>
                                        </div>
                                    </div>
                                    <div class="ms-auto" th:if="${isOwner}" style="position: relative; z-index: 10;">
                                        <form th:action="@{/posts/{id}/unpin(id=${p.id})}" method="post" style="margin: 0;">
                                            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                                            <input type="hidden" name="next" th:value="${currentPath}">
                                            <button type="submit" class="post-menu-btn text-danger" style="width: 28px; height: 28px; padding: 0; display: flex; align-items: center; justify-content: center;" title="Bỏ ghim" aria-label="Bỏ ghim">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                                <a href="javascript:void(0)" th:attr="data-post-url=@{/posts/{id}/fragment(id=${p.id})}" data-bs-toggle="modal" data-bs-target="#postDetailModal" class="text-decoration-none text-ink featured-card-link">
                                    <div style="font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 0;" th:if="${p.hasText()}" th:text="${p.rawContent}"></div>
                                </a>
                            </div>
                            <div class="mt-auto" th:if="${p.hasMedia()}">
                                <img th:if="${!p.hasVideo()}" th:src="${p.media[0].url}" style="width: 100%; height: 180px; object-fit: cover; display: block; border-top: var(--line);">
                                <video th:if="${p.hasVideo()}" th:src="${p.media[0].url}" style="width: 100%; height: 180px; object-fit: cover; display: block; border-top: var(--line);"></video>
                            </div>
                        </article>
                    </div>
                </th:block>
            </div>
        </div>

        <div id="feed" class="feed">
            <th:block th:replace="~{feed/list :: list}"></th:block>
        </div>
        <section class="note note--sky empty" th:if="${#lists.isEmpty(page.posts)}">
            <h2 class="h3">Chưa có bài viết nào</h2>
            <p th:text="${isOwner} ? 'Bài bạn đăng sẽ xuất hiện ở đây. Về bảng tin để đăng bài đầu tiên nhé.' : 'Bài viết công khai sẽ xuất hiện ở đây.'">...</p>
        </section>
    </th:block>

    <th:block th:if="${me != null}">
        <div th:replace="~{fragments/post-modals :: modals}"></div>
    </th:block>

    <!-- MODALS CHO FRIENDS / FOLLOWERS / FOLLOWING -->
    <div class="modal fade" id="friendsModal" tabindex="-1" aria-labelledby="friendsModalLabel" aria-hidden="true" 
         th:attr="data-list-url=@{/u/{u}/friends-fragment(u=${owner.username})}">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="friendsModalLabel">Bạn bè</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body p-3" data-list-container></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="followersModal" tabindex="-1" aria-labelledby="followersModalLabel" aria-hidden="true" 
         th:attr="data-list-url=@{/u/{u}/followers-fragment(u=${owner.username})}">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="followersModalLabel">Người theo dõi</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body p-3" data-list-container></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="followingModal" tabindex="-1" aria-labelledby="followingModalLabel" aria-hidden="true" 
         th:attr="data-list-url=@{/u/{u}/following-fragment(u=${owner.username})}">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="followingModalLabel">Đang theo dõi</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body p-3" data-list-container></div>
            </div>
        </div>
    </div>

    <style>
        /* Tắt viền và đổ bóng của thẻ bài viết khi nằm trong modal chi tiết */
        #postDetailModal .post {
            border: none;
            box-shadow: none;
            border-radius: 0;
            padding: 0 1.2rem 1.25rem;
        }
    </style>
    <div class="modal fade" id="postDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
            <div class="modal-content" style="background-color: var(--white); border: var(--line); border-radius: var(--r-card);">
                <div class="modal-header border-0 pb-0 justify-content-end">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body p-0" data-list-container></div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
