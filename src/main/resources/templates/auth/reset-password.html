<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Đặt mật khẩu mới', ~{::main}, 'none', ~{})}">
<head><title>Đặt mật khẩu mới</title></head>
<body>
<main>
    <div class="auth-wrap">
        <section class="note note--taped auth-card" aria-labelledby="t">
            <th:block th:if="${invalidToken}">
                <h1 id="t">Link này hết dùng được rồi</h1>
                <div class="alert-al alert-al--warn" role="alert">
                    <p>Link đặt lại mật khẩu đã hết hạn, đã được dùng, hoặc bị sai. Xin link mới là được.</p>
                </div>
                <a class="btn-al btn-al--sky btn-al--block" th:href="@{/forgot-password}">Xin link mới</a>
            </th:block>

            <th:block th:unless="${invalidToken}">
                <h1 id="t">Đặt mật khẩu mới</h1>
                <p class="lead">Chọn mật khẩu khó đoán một chút nha.</p>
                <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post" novalidate>
                    <div th:replace="~{fragments/ui :: globalErrors}"></div>
                    <input type="hidden" th:field="*{token}">
                    <div th:replace="~{fragments/forms :: passwordField('password', 'Mật khẩu mới', 'new-password', 'Ít nhất 8 ký tự, có cả chữ và số.')}"></div>
                    <div th:replace="~{fragments/forms :: passwordField('confirmPassword', 'Nhập lại mật khẩu mới', 'new-password', null)}"></div>
                    <button type="submit" class="btn-al btn-al--mint btn-al--lg btn-al--block">Lưu mật khẩu mới</button>
                </form>
            </th:block>
        </section>
        <div th:replace="~{fragments/ui :: authSide('Gần xong rồi!', 'Đổi xong, các thiết bị khác sẽ tự đăng xuất cho an toàn.', 'mint')}"></div>
    </div>
</main>
</body>
</html>
