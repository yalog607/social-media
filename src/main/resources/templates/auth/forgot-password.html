<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Quên mật khẩu', ~{::main}, 'none', ~{})}">
<head><title>Quên mật khẩu</title></head>
<body>
<main>
    <div class="auth-wrap">
        <section class="note note--taped auth-card" aria-labelledby="t">
            <h1 id="t">Quên mật khẩu? Không sao!</h1>

            <th:block th:if="${sent}">
                <div class="alert-al alert-al--ok" role="status">
                    <p>Nếu email này có tài khoản, mình đã gửi link đặt lại mật khẩu rồi. Link dùng được trong 30 phút.</p>
                </div>
                <a class="btn-al btn-al--white btn-al--block" th:href="@{/login}">Về trang đăng nhập</a>
            </th:block>

            <th:block th:unless="${sent}">
                <p class="lead">Nhập email đã đăng ký, mình gửi link để bạn đặt mật khẩu mới.</p>
                <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post" novalidate>
                    <div th:replace="~{fragments/ui :: globalErrors}"></div>
                    <div th:replace="~{fragments/forms :: textField('email', 'Email', 'email', 'email', null)}"></div>
                    <button type="submit" class="btn-al btn-al--sky btn-al--lg btn-al--block">Gửi link đặt lại</button>
                </form>
                <div class="auth-links">
                    <a th:href="@{/login}">Nhớ ra rồi, đăng nhập</a>
                </div>
            </th:block>
        </section>
        <div th:replace="~{fragments/ui :: authSide('Ai cũng có lúc quên.', 'Đặt lại xong là vào chơi tiếp thôi.', 'sky')}"></div>
    </div>
</main>
</body>
</html>
