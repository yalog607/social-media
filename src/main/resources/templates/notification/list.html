<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Thông báo', ~{::main}, 'notifications', ~{})}">
<head><title>Thông báo</title></head>
<body>
<main>
    <div class="page-title"><h1>Thông báo</h1></div>

    <th:block th:each="n : ${items}">
        <th:block th:replace="~{notification/row :: row(${n})}"></th:block>
    </th:block>

    <section class="note note--sky empty" th:if="${#lists.isEmpty(items)}">
        <h2 class="h3">Chưa có thông báo nào</h2>
        <p>Khi có ai kết bạn, theo dõi, bình luận hay thả cảm xúc bài của bạn, thông báo sẽ hiện ở đây.</p>
    </section>
</main>
</body>
</html>
