<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Thông báo', ~{::main}, 'notifications', ~{})}">
<head><title>Thông báo</title></head>
<body>
<main>
    <div class="page-title"><h1>Thông báo</h1></div>

    <a class="search-user notification-row" th:each="n : ${items}" th:classappend="${!n.read} ? 'is-unread'"
       th:href="${n.conversationId != null} ? @{/messages/{id}(id=${n.conversationId})} : (${n.postId != null} ? @{/posts/{id}(id=${n.postId})} : @{/u/{u}(u=${n.actor.username})})">
        <span th:replace="~{fragments/ui :: avatar(${n.actor}, '')}"></span>
        <span class="search-user-info">
            <span class="notification-text" th:text="${n.text}">Ai đó đã làm gì đó</span>
            <span class="notification-body" th:if="${n.detail != null}" th:text="${n.detail}">Nội dung</span>
            <span class="notification-time" th:title="${@timeAgo.full(n.createdAt)}" th:text="${@timeAgo.format(n.createdAt)}">vừa xong</span>
        </span>
    </a>

    <section class="note note--sky empty" th:if="${#lists.isEmpty(items)}">
        <h2 class="h3">Chưa có thông báo nào</h2>
        <p>Khi có ai kết bạn, theo dõi, bình luận hay thả cảm xúc bài của bạn, thông báo sẽ hiện ở đây.</p>
    </section>
</main>
</body>
</html>
