<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Bảng tin', ~{::main}, 'home', ~{::aside})}">
<head><title>Bảng tin</title></head>
<body>
<main>
    <div class="page-title">
        <h1>Bảng tin</h1>
        <span th:replace="~{fragments/ui :: roleChip(${me.primaryRole()})}"></span>
    </div>

    <div th:replace="~{fragments/composer :: composer}"></div>

    <div id="feed" class="feed">
        <th:block th:replace="~{feed/list :: list}"></th:block>
    </div>

    <section class="note note--sky empty" aria-labelledby="empty-title" th:if="${#lists.isEmpty(page.posts)}">
        <svg viewBox="0 0 160 120" role="img" aria-label="Tấm bảng trống với vài chiếc ghim">
            <rect x="14" y="14" width="132" height="92" rx="10" fill="#FFF8EC" stroke="#16121F" stroke-width="3"/>
            <rect x="34" y="34" width="44" height="30" rx="4" fill="#FFE45E" stroke="#16121F" stroke-width="3" transform="rotate(-4 56 49)"/>
            <rect x="88" y="42" width="38" height="36" rx="4" fill="#FF8FB1" stroke="#16121F" stroke-width="3" transform="rotate(5 107 60)"/>
            <circle cx="56" cy="32" r="5" fill="#7DE0B5" stroke="#16121F" stroke-width="2.5"/>
            <circle cx="107" cy="40" r="5" fill="#B8A4FF" stroke="#16121F" stroke-width="2.5"/>
            <path d="M42 88h76" stroke="#16121F" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
        </svg>
        <h2 id="empty-title" class="h3">Chưa có bài nào để dán lên đây</h2>
        <p>Hãy là người đăng bài đầu tiên. Bài công khai của mọi người sẽ hiện ở đây.</p>
    </section>

    <div th:replace="~{fragments/post-modals :: modals}"></div>
    <div th:replace="~{fragments/mood :: customMoodModal}"></div>
</main>

<aside class="app-rail">
    <!-- Bảng tâm trạng hôm nay của bạn -->
    <div th:replace="~{fragments/mood :: moodWidget}"></div>

    <!-- Vibe hôm nay của hội bạn bè -->
    <div th:replace="~{fragments/mood :: friendsMoodBar}"></div>

    <!-- Nhắc hoàn thiện hồ sơ: chỉ hiện khi còn thiếu, biến mất khi xong -->
    <section class="note note--lemon mb-3 profile-todo-card" aria-labelledby="hello"
             th:if="${me.profile.avatarUrl == null or me.profile.bio == null or #strings.isEmpty(me.profile.bio)}">
        <h2 id="hello" class="h4 mb-2" th:text="'Chào ' + ${me.profile.displayName} + '!'">Chào bạn!</h2>
        <p class="text-soft mb-2 small">Hoàn thiện hồ sơ để mọi người nhận ra bạn nhé.</p>
        <ul class="todo">
            <li class="todo-item" th:classappend="${me.profile.avatarUrl != null} ? 'done'">
                <span class="tick" aria-hidden="true" th:text="${me.profile.avatarUrl != null} ? '✓' : ''"></span>
                <span class="label small">Thêm ảnh đại diện</span>
                <a class="ms-auto btn-al btn-al--sm" th:unless="${me.profile.avatarUrl != null}" th:href="@{/settings}">Thêm</a>
            </li>
            <li class="todo-item" th:classappend="${me.profile.bio != null and !#strings.isEmpty(me.profile.bio)} ? 'done'">
                <span class="tick" aria-hidden="true" th:text="${me.profile.bio != null and !#strings.isEmpty(me.profile.bio)} ? '✓' : ''"></span>
                <span class="label small">Viết vài dòng giới thiệu</span>
                <a class="ms-auto btn-al btn-al--sm" th:unless="${me.profile.bio != null and !#strings.isEmpty(me.profile.bio)}" th:href="@{/settings}">Viết</a>
            </li>
        </ul>
    </section>

    <!-- Chủ đề thịnh hành -->
    <div th:replace="~{fragments/hashtags :: trending(${trending})}"></div>
</aside>
</body>
</html>
