<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Tạo bình chọn', ~{::main}, 'creator', ~{})}">
<head><title>Tạo bình chọn</title></head>
<body>
<main>
    <div class="page-title">
        <h1>Tạo bình chọn</h1>
        <a class="btn-al btn-al--white btn-al--sm" th:href="@{/creator}">← Creator Studio</a>
    </div>

    <section class="note note--taped mb-4" aria-labelledby="poll-title">
        <h2 id="poll-title" class="h4 mb-2">Bình chọn mới</h2>
        <p class="text-soft small">Bình chọn được đăng công khai lên bảng tin và gửi thông báo cho người theo dõi (không gồm người chặn bạn hoặc bị bạn chặn). Mỗi người chọn một lựa chọn và không đổi được.</p>
        <form th:action="@{/creator/polls}" method="post" id="pollForm">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <input type="hidden" name="tzOffset" id="pollTz">
            <div class="field">
                <label for="pQuestion">Câu hỏi</label>
                <textarea id="pQuestion" name="question" class="input-al" rows="3" required maxlength="2000" th:text="${draftQuestion}"></textarea>
            </div>
            <div class="field">
                <span class="label-al" id="pOptionsLabel">Lựa chọn (2 đến <span th:text="${maxOptions}">6</span>)</span>
                <div id="pOptions" aria-labelledby="pOptionsLabel" th:attr="data-max=${maxOptions}">
                    <input name="options" class="input-al mb-2" th:maxlength="${maxLabel}" placeholder="Lựa chọn 1"
                           th:each="o, st : ${draftOptions != null ? draftOptions : {'', ''}}" th:value="${o}"
                           th:attr="placeholder='Lựa chọn ' + ${st.count}">
                </div>
                <button type="button" class="btn-al btn-al--white btn-al--sm" id="pAddOption">+ Thêm lựa chọn</button>
            </div>
            <div class="field">
                <label for="pCloses">Giờ kết thúc (không bắt buộc, tối đa <span th:text="${maxDays}">30</span> ngày)</label>
                <input id="pCloses" name="closesAt" type="datetime-local" class="input-al">
            </div>
            <button type="submit" class="btn-al btn-al--pink">Đăng bình chọn</button>
        </form>
    </section>
<script>
    (function () {
        var max = parseInt(document.getElementById('pOptions').dataset.max, 10);
        var box = document.getElementById('pOptions');
        var add = document.getElementById('pAddOption');
        document.getElementById('pollTz').value = new Date().getTimezoneOffset();
        function sync() { add.hidden = box.children.length >= max; }
        add.addEventListener('click', function () {
            if (box.children.length >= max) return;
            var input = box.children[0].cloneNode();
            input.value = '';
            input.placeholder = 'Lựa chọn ' + (box.children.length + 1);
            box.appendChild(input);
            sync();
            input.focus();
        });
        sync();
    })();
</script>
</main>

</body>
</html>
